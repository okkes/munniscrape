# Production stack: both control planes, their databases, and the
# http-tier agents. Intended for the Synology NAS that already runs munni.
#
#   docker compose --env-file deploy/env/.env.prod -f deploy/docker-compose.yml up -d
#
# The browser-tier agents are in the `residential` profile and belong on a
# different machine entirely - see the comment above them.
#
# Nothing here is reachable from the internet:
#   * the control planes publish only on ${LAN_BIND_IP};
#   * they terminate TLS themselves and pin the consumer's client
#     certificate, because a LAN is not a trust boundary;
#   * the database is on an internal network with no published port;
#   * the agents publish nothing at all - every call they make is
#     outbound.
#
# Every ${VAR:?...} below fails the `up` rather than starting a service
# that is quietly misconfigured.
#
# ── NOT RUNNABLE YET. READ THIS FIRST. ──────────────────────────────────
#
# This file was written ahead of the code and has never been run against
# it. Two separate problems, and the second is the dangerous one.
#
# 1. Key names. The control plane binds `ConnectorOptions` from the section
#    named `Connector` and the agent binds from `ConnectorAgent`. The names
#    below have been corrected to match. They previously read `Bundle__`,
#    `Auth__`, `Db__`, `Agents__` and `Agent__` and bound to NOTHING - a
#    production stack would have come up on an ephemeral bundle key,
#    sealing every user's credentials under a key that dies with the
#    process, and looked healthy doing it.
#
# 2. Options that do not exist. These are marked NOT IMPLEMENTED below and
#    are kept only because deleting them would erase a design decision
#    somebody made on purpose. Nothing reads them today:
#      Webhook__Url, Webhook__SigningKey  - no webhook sender exists
#      Features__Vault, Vault__Kek        - server custody (B5) is unbuilt
#      Features__RawPayloadDebug          - no such switch
#      Db__AutoMigrate                    - migration is unconditional
#      Auth__Mtls__CaPath                 - Kestrel is given no CA here
#    Do not add a feature by uncommenting a variable. The variable is not
#    the feature.
#
# Until both are resolved and this stack has actually been brought up
# once, deploy/docker-compose.local.yml is the only compose file in this
# repository known to work.
name: connectors

x-api-common: &api-common
  restart: unless-stopped
  environment: &api-env
    ASPNETCORE_ENVIRONMENT: Production
    # ASPNETCORE_URLS is deliberately unset: it would override the Kestrel
    # endpoints below, collapsing the TLS listener into plain HTTP.
    #
    # Health is a separate plaintext listener that is never published. It
    # exists for the container healthcheck and for an operator inside the
    # network; the spec makes /v1/health unauthenticated, so it must not
    # share the listener that carries everything else.
    Kestrel__Endpoints__Health__Url: http://+:8080
    Kestrel__Endpoints__Public__Url: https://+:8443
    Kestrel__Endpoints__Public__Certificate__Path: /tls/server.crt.pem
    Kestrel__Endpoints__Public__Certificate__KeyPath: /tls/server.key.pem
    # AllowCertificate, not RequireCertificate: /v1/* demands a pinned
    # consumer certificate, but /agent/v1/* is a different identity class
    # authenticated by a per-agent token, and an agent on a user's own
    # machine has no client certificate to present.
    Kestrel__Endpoints__Public__ClientCertificateMode: AllowCertificate
    Connector__Mode: Production
    Connector__Database__Provider: Postgres
    Connector__Auth__Authority: ${AUTH_AUTHORITY:?set AUTH_AUTHORITY (the Logto OIDC issuer)}
    Connector__Auth__ClientCertificateThumbprints__0: ${CONSUMER_CLIENT_CERT_FINGERPRINT:?set CONSUMER_CLIENT_CERT_FINGERPRINT}
    # NOT IMPLEMENTED - nothing reads this. Kestrel is not given a CA to
    # validate client certificates against; ClientCertificateMode above
    # only asks for one. Pinning happens against the thumbprint allowlist.
    # Auth__Mtls__CaPath: /tls/ca.crt.pem
    BUILD_NUMBER: ${TAG:-latest}
  volumes:
    # Server cert, its key, and the internal CA that signs the consumer's
    # client cert. Files rather than environment variables: env shows up in
    # `docker inspect` and in every crash dump.
    - ./env/tls:/tls:ro
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/v1/health || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 40s

x-agent-common: &agent-common
  restart: unless-stopped
  # No ports, no volumes-from, no database credential, no healthcheck: an
  # agent listens on nothing and its liveness is the heartbeat the control
  # plane already tracks (GET /v1/agents).
  environment: &agent-env
    DOTNET_ENVIRONMENT: Production
    ConnectorAgent__MaxConcurrency: "1"
    ConnectorAgent__Egress__Country: ${AGENT_EGRESS_COUNTRY:-NL}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      # initdb/01-create-databases.sql reads these and creates one database
      # and one role per service, with cross-connect revoked.
      BANK_DB_PASSWORD: ${BANK_DB_PASSWORD:?set BANK_DB_PASSWORD}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?set SHOP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    # No published port. `docker compose exec postgres psql` is one command
    # and costs the LAN nothing. There is also no backup service here: a
    # connector stages data for at most seven days and owns no durable user
    # record, so a nightly dump would back up secrets and nothing else.
    networks: [data]

  bank-api:
    <<: *api-common
    image: ${REGISTRY:-ghcr.io/okkes}/bank-connector-api:${TAG:-latest}
    environment:
      <<: *api-env
      # ServiceKind is set in BankConnector.Api/Program.cs, not here.
      Connector__Database__ConnectionString: Host=postgres;Database=bank_connector;Username=bank_connector;Password=${BANK_DB_PASSWORD:?set BANK_DB_PASSWORD}
      Connector__Auth__Audience: ${BANK_M2M_AUDIENCE:?set BANK_M2M_AUDIENCE}
      # Rotation is a kid bump: mint BUNDLE_SEAL_KEY_K2, point
      # BUNDLE_CURRENT_KID at it, and leave K1 in the ring until every
      # bundle sealed under it has passed its TTL. No mass re-login.
      Connector__Bundle__CurrentKid: ${BUNDLE_CURRENT_KID:?set BUNDLE_CURRENT_KID}
      Connector__Bundle__Keys__k1: ${BANK_BUNDLE_SEAL_KEY_K1:?set BANK_BUNDLE_SEAL_KEY_K1}
      Connector__Bundle__Keys__k2: ${BANK_BUNDLE_SEAL_KEY_K2:-}
      Connector__EnrollmentHmacKey: ${BANK_AGENT_ENROLLMENT_HMAC:?set BANK_AGENT_ENROLLMENT_HMAC}
      # NOT IMPLEMENTED - see the header. No webhook sender, no vault, no
      # raw-payload switch, and no Auth:RequiredScope binding exist.
      # Auth__RequiredScope: connector.bank
      # Webhook__Url: ${BANK_WEBHOOK_URL}
      # Webhook__SigningKey: ${BANK_WEBHOOK_SIGNING_KEY}
      # Features__Vault: ${BANK_FEATURE_VAULT:-false}
      # Vault__Kek: ${BANK_VAULT_KEK:-}
      # Features__RawPayloadDebug: "false"
    ports:
      - "${LAN_BIND_IP:?set LAN_BIND_IP (the NAS LAN address; 0.0.0.0 is not acceptable)}:8390:8443"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, mesh]

  shop-api:
    <<: *api-common
    image: ${REGISTRY:-ghcr.io/okkes}/shop-connector-api:${TAG:-latest}
    environment:
      <<: *api-env
      # ServiceKind is set in ShopConnector.Api/Program.cs, not here.
      Connector__Database__ConnectionString: Host=postgres;Database=shop_connector;Username=shop_connector;Password=${SHOP_DB_PASSWORD:?set SHOP_DB_PASSWORD}
      Connector__Auth__Audience: ${SHOP_M2M_AUDIENCE:?set SHOP_M2M_AUDIENCE}
      Connector__Bundle__CurrentKid: ${BUNDLE_CURRENT_KID:?set BUNDLE_CURRENT_KID}
      Connector__Bundle__Keys__k1: ${SHOP_BUNDLE_SEAL_KEY_K1:?set SHOP_BUNDLE_SEAL_KEY_K1}
      Connector__Bundle__Keys__k2: ${SHOP_BUNDLE_SEAL_KEY_K2:-}
      Connector__EnrollmentHmacKey: ${SHOP_AGENT_ENROLLMENT_HMAC:?set SHOP_AGENT_ENROLLMENT_HMAC}
      # NOT IMPLEMENTED - see the header.
      # Auth__RequiredScope: connector.shop
      # Webhook__Url: ${SHOP_WEBHOOK_URL}
      # Webhook__SigningKey: ${SHOP_WEBHOOK_SIGNING_KEY}
      # Features__Vault: ${SHOP_FEATURE_VAULT:-false}
      # Vault__Kek: ${SHOP_VAULT_KEK:-}
      # Features__RawPayloadDebug: "false"
    ports:
      - "${LAN_BIND_IP:?set LAN_BIND_IP (the NAS LAN address; 0.0.0.0 is not acceptable)}:8391:8443"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, mesh]

  # The http-tier agents. These may live on the NAS: they never start a
  # browser, so the NAS's shared egress address is not a problem for them.
  # Note they are on `mesh` only - never on `data`. An agent holds a
  # plaintext credential for the length of a job, and one that cannot
  # resolve postgres cannot be talked into reading it.
  bank-agent-http:
    <<: *agent-common
    image: ${REGISTRY:-ghcr.io/okkes}/bank-connector-agent:${TAG:-latest}
    environment:
      <<: *agent-env
      ConnectorAgent__AgentName: nas-http-bank
      ConnectorAgent__Class: pooled
      ConnectorAgent__ControlPlaneBaseUrl: ${BANK_CONTROL_PLANE_URL:-https://bank-api:8443}
      ConnectorAgent__EnrollmentCode: ${BANK_NAS_AGENT_ENROLLMENT_CODE:?mint a code with POST /v1/agents/enrollment, then set BANK_NAS_AGENT_ENROLLMENT_CODE}
      ConnectorAgent__Runtimes__0: http
      ConnectorAgent__Egress__Kind: any
      # NOT IMPLEMENTED - the agent has no option for a control-plane CA.
      # It uses the container's trust store, so an internal CA has to be
      # installed into the image or mounted over /etc/ssl/certs.
      # Agent__ControlPlaneCaPath: /tls/ca.crt.pem
    volumes:
      # The enrollment. An agent that loses this comes back as a stranger
      # and needs a fresh one-time code, which means a human present for
      # every container recreate.
      - bank_agent_state:/state
    depends_on:
      bank-api:
        condition: service_healthy
    networks: [mesh]

  shop-agent-http:
    <<: *agent-common
    image: ${REGISTRY:-ghcr.io/okkes}/shop-connector-agent:${TAG:-latest}
    environment:
      <<: *agent-env
      ConnectorAgent__AgentName: nas-http-shop
      ConnectorAgent__Class: pooled
      ConnectorAgent__ControlPlaneBaseUrl: ${SHOP_CONTROL_PLANE_URL:-https://shop-api:8443}
      ConnectorAgent__EnrollmentCode: ${SHOP_NAS_AGENT_ENROLLMENT_CODE:?mint a code with POST /v1/agents/enrollment, then set SHOP_NAS_AGENT_ENROLLMENT_CODE}
      ConnectorAgent__Runtimes__0: http
      ConnectorAgent__Egress__Kind: any
      # NOT IMPLEMENTED - see bank-agent-http above.
      # Agent__ControlPlaneCaPath: /tls/ca.crt.pem
    volumes:
      - shop_agent_state:/state
    depends_on:
      shop-api:
        condition: service_healthy
    networks: [mesh]

  # ── where the browser-tier agents are NOT ────────────────────────────
  # There is deliberately no browser agent in this file. Every
  # browser-tier provider judges us on the address we connect from, and
  # the NAS's egress is the same datacenter-shaped address as everything
  # else it hosts; Jumbo tarpits exactly that. Those agents run on a mini
  # PC or Pi on the domestic line, with their own one-service compose file
  # on that box - see "The residential agent" in deploy/README.md.
  #
  # They are not a disabled profile here because compose interpolates
  # EVERY service regardless of profile: a file whose ${VAR:?} guards can
  # only be satisfied on one of the two hosts is a file that lies about
  # the other.

networks:
  # Postgres and the two control planes, and nothing else ever. Internal:
  # the database has no reason to reach the internet, and no published port
  # can be added to it by accident.
  data:
    internal: true
  # Control planes and agents. `docker network connect connectors_mesh
  # <consumer-api-container>` is the zero-published-port path for the
  # consumer; the LAN ports above exist for the case where it runs
  # elsewhere on the network.
  mesh:

volumes:
  pgdata:
  bank_agent_state:
  shop_agent_state:
